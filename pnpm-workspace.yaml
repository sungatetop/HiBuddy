packages:
  - profile/*
  - packages/*
  - desktop/*
  # tests 在跨端测试阶段加入

# pnpm 12 settings moved here (package.json "pnpm" field is no longer read).
# Native / postinstall builds required by the dsh runtime.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  electron: true
  koffi: true
  node-pty: true
  protobufjs: true
