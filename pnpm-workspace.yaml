packages:
  - profile/*
  - packages/*
  - desktop/*
  - tests/*
  # tests: 跨端集成测试（S4-7 起：Playwright E2E）

# pnpm 12 settings moved here (package.json "pnpm" field is no longer read).
# Native / postinstall builds required by the dsh runtime.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  electron: true
  electron-winstaller: true
  koffi: true
  node-pty: true
  protobufjs: true
