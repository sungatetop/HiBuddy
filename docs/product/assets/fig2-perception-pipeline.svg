<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#FFFFFF"/>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">感知与决策管线：事件源 → 两级过滤 → 事件信封 → 管家决策</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#64748B">事件源只产出信封 · 是否行动由管家判断 · 观察模式默认 · 外部内容标记 untrusted</text>

  <!-- C1: 事件源 -->
  <rect x="40" y="110" width="176" height="330" rx="10" fill="#F0FDFA" stroke="#14B8A6"/>
  <text x="128" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#134E4A">事件源</text>
  <rect x="56" y="154" width="144" height="60" rx="8" fill="#FFFFFF" stroke="#99F6E4"/>
  <text x="128" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#0F766E">scheduler</text>
  <text x="128" y="200" text-anchor="middle" font-size="11" fill="#475569">定时 / 周期任务到期</text>
  <rect x="56" y="224" width="144" height="60" rx="8" fill="#FFFFFF" stroke="#99F6E4"/>
  <text x="128" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#0F766E">monitor</text>
  <text x="128" y="270" text-anchor="middle" font-size="11" fill="#475569">周期监控 · 条件=自然语言</text>
  <rect x="56" y="294" width="144" height="60" rx="8" fill="#FFFFFF" stroke="#99F6E4"/>
  <text x="128" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#0F766E">workspace-watch</text>
  <text x="128" y="340" text-anchor="middle" font-size="11" fill="#475569">目录变更确定性扫描</text>
  <rect x="56" y="364" width="144" height="60" rx="8" fill="#FFFFFF" stroke="#99F6E4" stroke-dasharray="5 3"/>
  <text x="128" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">IM 渠道（P1）</text>
  <text x="128" y="410" text-anchor="middle" font-size="11" fill="#64748B">钉钉 / 飞书 / 微信</text>

  <line x1="216" y1="275" x2="248" y2="275" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- C2: Trigger -->
  <rect x="250" y="110" width="156" height="330" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="328" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Trigger 触发</text>
  <text x="328" y="156" text-anchor="middle" font-size="11" fill="#64748B">不可变事件信封</text>
  <rect x="266" y="176" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="328" y="194" text-anchor="middle" font-size="11" fill="#334155">指纹 sha256 前 16 位</text>
  <text x="328" y="211" text-anchor="middle" font-size="11" fill="#64748B">同源去重 · 幂等</text>
  <rect x="266" y="230" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="328" y="248" text-anchor="middle" font-size="11" fill="#334155">untrusted 标记</text>
  <text x="328" y="265" text-anchor="middle" font-size="11" fill="#64748B">内容按数据不执行</text>
  <rect x="266" y="284" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="328" y="302" text-anchor="middle" font-size="11" fill="#334155">读位游标</text>
  <text x="328" y="319" text-anchor="middle" font-size="11" fill="#64748B">重启恢复不重放</text>
  <text x="328" y="370" text-anchor="middle" font-size="11" fill="#64748B">聚合：单次扫描</text>
  <text x="328" y="388" text-anchor="middle" font-size="11" fill="#64748B">全部变更合一条</text>

  <line x1="406" y1="275" x2="438" y2="275" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- C3: 两级过滤 -->
  <rect x="440" y="110" width="188" height="330" rx="10" fill="#FFF7ED" stroke="#F97316"/>
  <text x="534" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">两级过滤</text>
  <rect x="456" y="156" width="156" height="86" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="534" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">gate（确定性闸）</text>
  <text x="534" y="200" text-anchor="middle" font-size="11" fill="#475569">来源启停 · 开放票去重</text>
  <text x="534" y="218" text-anchor="middle" font-size="11" fill="#475569">载荷形状校验 · 零 LLM 成本</text>
  <line x1="534" y1="242" x2="534" y2="256" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="456" y="258" width="156" height="86" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="534" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412">assessment（LLM 研判）</text>
  <text x="534" y="302" text-anchor="middle" font-size="11" fill="#475569">检查会话单轮研判</text>
  <text x="534" y="320" text-anchor="middle" font-size="11" fill="#475569">act / would-act / drop</text>
  <text x="534" y="378" text-anchor="middle" font-size="11" fill="#7C2D12">退避：interval × 2^(n−1)</text>
  <text x="534" y="396" text-anchor="middle" font-size="11" fill="#7C2D12">封顶 30min · 3 连败降级</text>
  <text x="534" y="414" text-anchor="middle" font-size="11" fill="#7C2D12">成功自恢复</text>

  <line x1="628" y1="275" x2="660" y2="275" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- C4: 管家 -->
  <rect x="662" y="110" width="172" height="330" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="748" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#312E81">管家（butler）</text>
  <rect x="678" y="156" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="748" y="180" text-anchor="middle" font-size="11.5" fill="#3730A3">入站队列</text>
  <text x="748" y="198" text-anchor="middle" font-size="11" fill="#475569">单轮串行泵 + 聚合</text>
  <rect x="678" y="222" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="748" y="246" text-anchor="middle" font-size="11.5" fill="#3730A3">情境快照组装</text>
  <text x="748" y="264" text-anchor="middle" font-size="11" fill="#475569">确定上下文先于模型记忆</text>
  <rect x="678" y="288" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="748" y="312" text-anchor="middle" font-size="11.5" fill="#3730A3">决策</text>
  <text x="748" y="330" text-anchor="middle" font-size="11" fill="#475569">是否行动 · 如何行动</text>
  <text x="748" y="380" text-anchor="middle" font-size="11" fill="#475569">免打扰窗抑制</text>
  <text x="748" y="398" text-anchor="middle" font-size="11" fill="#475569">perceptionEvents 总开关</text>

  <line x1="834" y1="275" x2="866" y2="275" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- C5: 出口 -->
  <rect x="868" y="110" width="112" height="330" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="924" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">三种出口</text>
  <rect x="882" y="156" width="84" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="924" y="182" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">观察模式</text>
  <text x="924" y="200" text-anchor="middle" font-size="10.5" fill="#64748B">would-act</text>
  <text x="924" y="216" text-anchor="middle" font-size="10.5" fill="#64748B">只记录不动</text>
  <rect x="882" y="246" width="84" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="924" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">auto 建票</text>
  <text x="924" y="290" text-anchor="middle" font-size="10.5" fill="#64748B">next_run_at</text>
  <text x="924" y="306" text-anchor="middle" font-size="10.5" fill="#64748B">立即到期走闸</text>
  <rect x="882" y="336" width="84" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="924" y="362" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">直接汇报</text>
  <text x="924" y="380" text-anchor="middle" font-size="10.5" fill="#64748B">send_message</text>
  <text x="924" y="396" text-anchor="middle" font-size="10.5" fill="#64748B">_to_user</text>

  <!-- Bottom band: 三层感知 -->
  <text x="500" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">支撑感知体系（三层次）</text>
  <rect x="40" y="496" width="296" height="118" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <rect x="40" y="496" width="6" height="118" rx="3" fill="#0284C7"/>
  <text x="62" y="522" font-size="13" font-weight="700" fill="#0C4A6E">L0 上下文保真</text>
  <text x="62" y="546" font-size="11.5" fill="#475569">结构化入站信封（谁 · 因什么票 · 因什么源）</text>
  <text x="62" y="566" font-size="11.5" fill="#475569">每轮情境快照 · 回执富化（产物文件清单）</text>
  <text x="62" y="586" font-size="11.5" fill="#475569">按轮次幂等 · 相对时间 · 结构化引用</text>
  <rect x="352" y="496" width="296" height="118" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <rect x="352" y="496" width="6" height="118" rx="3" fill="#D97706"/>
  <text x="374" y="522" font-size="13" font-weight="700" fill="#7C2D12">L1 状态边沿事件</text>
  <text x="374" y="546" font-size="11.5" fill="#475569">stalled 停滞 / resumed 恢复</text>
  <text x="374" y="566" font-size="11.5" fill="#475569">monitor_triggered 监控命中</text>
  <text x="374" y="586" font-size="11.5" fill="#475569">question_unanswered 提问未答（频控）</text>
  <rect x="664" y="496" width="296" height="118" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <rect x="664" y="496" width="6" height="118" rx="3" fill="#0D9488"/>
  <text x="686" y="522" font-size="13" font-weight="700" fill="#134E4A">L2 感知面扩展</text>
  <text x="686" y="546" font-size="11.5" fill="#475569">workspace-watch（已落地）</text>
  <text x="686" y="566" font-size="11.5" fill="#475569">网页 / RSS / 邮件 / IM（SourceKind registry）</text>
  <text x="686" y="586" font-size="11.5" fill="#475569">只读查询工具 · 新增来源编排层零改动</text>
</svg>
