<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1000" height="860" fill="#FFFFFF"/>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">一条委派的完整生命周期：从目标到主动汇报</text>

  <!-- Approval highlight band -->
  <rect x="50" y="330" width="900" height="286" rx="8" fill="#EEF2FF" opacity="0.45"/>
  <text x="58" y="326" font-size="11" font-weight="600" fill="#4F46E5">审批分级代管 / 升级 —— 用户注意力只花在这里（L0/L1 管家代答留痕，L2 才升级请用户确认）</text>

  <!-- Participant headers -->
  <rect x="30" y="60" width="120" height="40" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="90" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">用户</text>
  <rect x="240" y="60" width="130" height="40" rx="8" fill="#F8FAFC" stroke="#0284C7"/>
  <text x="305" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">对话界面</text>
  <text x="305" y="94" text-anchor="middle" font-size="10" fill="#64748B">消息账本（in/out）</text>
  <rect x="450" y="60" width="120" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="510" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">管家</text>
  <rect x="660" y="60" width="120" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text x="720" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#134E4A">确定性层</text>
  <text x="720" y="94" text-anchor="middle" font-size="10" fill="#64748B">票务 · 编排 · 账本</text>
  <rect x="850" y="60" width="120" height="40" rx="8" fill="#FFFBEB" stroke="#D97706"/>
  <text x="910" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">worker 会话</text>
  <text x="910" y="94" text-anchor="middle" font-size="10" fill="#92400E">普通 dsh 会话</text>

  <!-- Lifelines -->
  <line x1="90" y1="100" x2="90" y2="812" stroke="#CBD5E1" stroke-dasharray="4 4"/>
  <line x1="305" y1="100" x2="305" y2="812" stroke="#CBD5E1" stroke-dasharray="4 4"/>
  <line x1="510" y1="100" x2="510" y2="812" stroke="#CBD5E1" stroke-dasharray="4 4"/>
  <line x1="720" y1="100" x2="720" y2="812" stroke="#CBD5E1" stroke-dasharray="4 4"/>
  <line x1="910" y1="100" x2="910" y2="812" stroke="#CBD5E1" stroke-dasharray="4 4"/>

  <!-- 1 -->
  <circle cx="78" cy="132" r="10" fill="#0284C7"/>
  <text x="78" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <line x1="90" y1="132" x2="300" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="195" y="124" text-anchor="middle" font-size="12" fill="#0F172A">下达目标：「把这份周报数据整理成图表」</text>

  <!-- 2 -->
  <circle cx="293" cy="172" r="10" fill="#4F46E5"/>
  <text x="293" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <line x1="305" y1="172" x2="505" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="405" y="164" text-anchor="middle" font-size="12" fill="#0F172A">入站消息 · 唤醒单轮串行泵</text>

  <!-- 3 -->
  <circle cx="498" cy="212" r="10" fill="#4F46E5"/>
  <text x="498" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <line x1="510" y1="212" x2="715" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="612" y="204" text-anchor="middle" font-size="12" fill="#0F172A">create_session → Ticket pending → working</text>

  <!-- 4 -->
  <circle cx="708" cy="252" r="10" fill="#0D9488"/>
  <text x="708" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
  <line x1="720" y1="252" x2="905" y2="252" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="812" y="244" text-anchor="middle" font-size="12" fill="#0F172A">agents.create 启动 resident-worker-&lt;ticketId&gt;</text>

  <!-- 5 worker self -->
  <rect x="830" y="278" width="160" height="42" rx="8" fill="#FFFBEB" stroke="#D97706"/>
  <text x="910" y="296" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350F">5 · 执行任务</text>
  <text x="910" y="312" text-anchor="middle" font-size="10.5" fill="#92400E">沙箱内工具调用 · 原生留痕</text>

  <!-- 6 -->
  <circle cx="698" cy="356" r="10" fill="#D97706"/>
  <text x="698" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>
  <line x1="910" y1="356" x2="725" y2="356" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="815" y="348" text-anchor="middle" font-size="12" fill="#0F172A">approval/request（高危操作，如越权写入）</text>

  <!-- 7 -->
  <circle cx="488" cy="396" r="10" fill="#0D9488"/>
  <text x="488" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">7</text>
  <line x1="720" y1="396" x2="515" y2="396" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="615" y="388" text-anchor="middle" font-size="12" fill="#0F172A">审批事件（分级闸）</text>

  <!-- 8 butler self -->
  <rect x="430" y="412" width="160" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="510" y="432" text-anchor="middle" font-size="11.5" font-weight="600" fill="#312E81">8 · 分级裁决</text>
  <text x="510" y="450" text-anchor="middle" font-size="10.5" fill="#475569">L0/L1 代答留痕 ｜ L2 升级</text>
  <text x="510" y="466" text-anchor="middle" font-size="10.5" fill="#475569">30min 无响应 fail-closed</text>

  <!-- 9 -->
  <circle cx="488" cy="496" r="10" fill="#4F46E5"/>
  <text x="488" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">9</text>
  <line x1="510" y1="496" x2="310" y2="496" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="410" y="488" text-anchor="middle" font-size="12" fill="#0F172A">审批卡（仅高危升级时）</text>

  <!-- 10 -->
  <circle cx="78" cy="536" r="10" fill="#0284C7"/>
  <text x="78" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">10</text>
  <line x1="305" y1="536" x2="95" y2="536" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="200" y="528" text-anchor="middle" font-size="12" fill="#0F172A">用户确认 / 驳回（唯一出场时刻之一）</text>
  <line x1="305" y1="562" x2="510" y2="562" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow3r)"/>
  <text x="408" y="554" text-anchor="middle" font-size="11" fill="#64748B">resolve_approval 回传</text>

  <!-- 11 -->
  <circle cx="698" cy="638" r="10" fill="#D97706"/>
  <text x="698" y="642" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">11</text>
  <line x1="910" y1="638" x2="725" y2="638" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="815" y="630" text-anchor="middle" font-size="12" fill="#0F172A">执行完成 · 产物落盘 · Ticket → completed</text>

  <!-- 12 -->
  <circle cx="488" cy="678" r="10" fill="#0D9488"/>
  <text x="488" y="682" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">12</text>
  <line x1="720" y1="678" x2="515" y2="678" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="615" y="670" text-anchor="middle" font-size="12" fill="#0F172A">回执富化入站（ReceiptData + 产物清单，幂等键）</text>

  <!-- 13 -->
  <circle cx="488" cy="718" r="10" fill="#4F46E5"/>
  <text x="488" y="722" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">13</text>
  <line x1="510" y1="718" x2="310" y2="718" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="410" y="710" text-anchor="middle" font-size="12" fill="#0F172A">send_message_to_user（Markdown 正文 + 附件）</text>

  <!-- 14 -->
  <circle cx="78" cy="758" r="10" fill="#0284C7"/>
  <text x="78" y="762" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">14</text>
  <line x1="305" y1="758" x2="95" y2="758" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="200" y="750" text-anchor="middle" font-size="12" fill="#0F172A">气泡 + 附件预览 —— 全程零轮询</text>

  <!-- Bottom note -->
  <rect x="50" y="820" width="900" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="500" y="842" text-anchor="middle" font-size="12.5" fill="#334155">用户全程只出现两次：下达目标 · 确认高危审批 —— 其余时间看到的只是一条「处理中」状态</text>
</svg>
