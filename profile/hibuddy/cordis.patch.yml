# HiBuddy profile-level patch layer.
#
# Applied after every bundle layer (dsh.layer order: bundle patches ->
# this file -> $DSH_HOME/cordis.patch.yml -> --patch overlays).
#
# Discipline (ADR-003 §3): prefer `insert` rows for HiBuddy's own plugins and
# plugin config. Overriding an official bundle row (same id) must restate every
# key the row needs and record the overridden row's current value plus the dsh
# version it was checked against. Use `disabled: true` instead of removal.

# ---------------------------------------------------------------------------
# LLM routing: the built-in DeepSeek provider is the product default.
#
# History (S0–S4): smoke tests ran on the built-in `minimax-cn` pi-ai route —
# the override row `- id: agent-default-model → {provider: minimax-cn, model:
# MiniMax-*}` plus an `llm-pi-ai` providers row declaring
# `minimax-cn.apiKeyEnv: MINIMAX_CN_API_KEY` (needed, else NO_ADAPTER —
# checked against dsh-llm-pi-ai 0.2.1-rc.5). S5-0 removed those rows so the
# official default applied; S5-4 restated them explicitly again (see the
# "Explicit default-model declaration" section at the end of this file) so
# the product route cannot drift with dsh-base defaults.
# The built-in `deepseek-official` route reads DEEPSEEK_API_KEY from the
# process env (dsh does not auto-load the repo-root .env — inject via setx or
# load .env into the process env before launching). If a non-DeepSeek smoke
# provider is needed again, restore the override rows above following the
# S0–S4 pattern.

# ---------------------------------------------------------------------------
# Provider retry budget (S5-3, PRD FR-02 rule 6): a failed model request is
# retried automatically ONCE, then the turn fails with the reason on display.
# The dsh retry machinery is already fully mounted: dsh-base bundles the
# executor as the `llm-retry` row (@deepseek-ai/dsh-llm-retry, dsh 0.2.1-rc.5
# dsh-base cordis.patch.yml L99-100) — no new mount is needed — and each
# provider adapter owns its policy via the RetryPolicySchema embedded in its
# config (@deepseek-ai/dsh-llm/retry-policy: NormalRetryPolicyConfig defaults
# to maxRetries: 5). This override restates the official row verbatim and adds
# only the retry budget. Overridden official row (dsh 0.2.1-rc.5, dsh-base
# cordis.patch.yml L525-526): mounted active with NO config keys.
# Upgrade discipline (ADR-005): re-check the official row when bumping dsh.
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    retryPolicy:
      mode: normal
      maxRetries: 1

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# ---------------------------------------------------------------------------
# Brand slot de-duplication (S2-1): @hibuddy/brand takes over the sidebar
# brand slots. The official browser brand package registers the same two
# generic slots (sidebar.brand.mark / sidebar.brand.name), so keeping both
# mounted gives a priority-0 duplicate registration on each slot.
#
# Overridden official row (dsh 0.2.1-rc.5, dsh-web-app bundle cordis.patch.yml
# L335-337 "Official occupants for the generic sidebar and conversation brand
# slots"):
#   - id: ui-brand-official
#     name: '@deepseek-ai/dsh-client-ui-brand-official'
# The official browser half registers ONLY those two sidebar slots (its
# conversation hero stays on the declaring package's animated fish fallback,
# i.e. the official build registers nothing there), so disabling this row
# loses no other surface — @hibuddy/brand supplies both occupants.
- id: ui-brand-official
  name: "@deepseek-ai/dsh-client-ui-brand-official"
  disabled: true

# ---------------------------------------------------------------------------
# Product persona (S2 task 2): the deployment-level default persona lives on
# the `system-prompt` row's config (personaPrefix). Layer order: dsh-base
# declares `personaPrefix: ''` (dsh 0.2.1-rc.5 dsh-base cordis.patch.yml
# L504-507), dsh-web-app restates it as the coding-agent persona
# ("You are a coding agent powered by the {{model}} model."), and this profile
# patch wins as the later layer. A patch replaces the whole `config` value
# (no deep merge), so the restatement below repeats every key the row
# declares: name + config.personaPrefix (both official layers declare only
# personaPrefix in config).
#
# `includeHarnessIdentity: false` disables the plugin's default
# "You are an AI agent powered by DeepSeek Harness." identity section
# (@deepseek-ai/dsh-system-prompt 0.2.1-rc.5 lib/index.js reads
# `config.includeHarnessIdentity ?? true`; neither official layer declares
# the key). Reason to disable: it conflicts with the product persona — with
# both sentences present MiniMax-M2.7 self-identified as "DeepSeek Harness
# Web GUI 中的编码助手" (S2-4 web walkthrough, 2026-11-03) — and our
# personaPrefix already carries the identity ("powered by the {{model}}
# model"). This is a deployment-owned informational sentence, not a
# capability: tool/skill documentation is unaffected.
#
# `@deepseek-ai/dsh-persona` is NOT used here: it is a per-agent row that must
# mount inside preset assembly (agent scope) and errors on global mount —
# product-level default persona belongs to the system-prompt row itself.
- id: system-prompt
  name: "@deepseek-ai/dsh-system-prompt"
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are HiBuddy, the user's everyday assistant, powered by the {{model}}
      model. Stay friendly and practical: understand the task, act with care,
      and answer in the user's language.

# ---------------------------------------------------------------------------
# Web GUI dev-context removal (S2-4b): the shipped Web bundle mounts
# @deepseek-ai/dsh-harness-dev-context as its `harness-dev-context` row, which
# injects two system-prompt paragraphs ("The runtime context names the DeepSeek
# Harness implementation checkout..." / "You are interacting with the user
# through the DeepSeek Harness Web GUI...") plus two runtime-context lines
# naming the DSH checkout path and GUI URL. That text is DSH-maintainer
# guidance and a second identity source — with the S2-2/S2-4 persona fixes in
# place MiniMax-M2.7 still self-identified as "DeepSeek Harness（深度求索的
# 智能体开发框架）Web GUI 中的 AI 助手" verbatim from these paragraphs (S2-4
# trace walkthrough, 2026-11-03). The package README endorses exactly this
# disablement for deployments where "the agent should not learn the harness
# checkout or GUI URL". The plugin takes no configuration, so disabling loses
# nothing else.
#
# Overridden official row (dsh 0.2.1-rc.5, dsh-web-app bundle): mounted
# active, no config keys.
- id: harness-dev-context
  name: "@deepseek-ai/dsh-harness-dev-context"
  disabled: true

# ---------------------------------------------------------------------------
# Standard-mode agent preset (S2-4 web walkthrough fix): web sessions run an
# agent preset whose child plugin list re-declares the persona. The shipped
# `preset-standard` row (dsh 0.2.1-rc.5, dsh-web-app presets/standard.patch.yml
# L4-14) mounts @deepseek-ai/dsh-persona with
# `prefix: You are a coding agent powered by the {{model}} model.` — the SAME
# prompt-section order (DEPLOYMENT_PERSONA_PREFIX) as the deployment
# personaPrefix above, registered earlier, so the model sees the coding-agent
# sentence first and adopted it: with only the deployment patch, MiniMax-M2.7
# self-identified as "DeepSeek Harness Web GUI 中的编码助手" (S2-4 walkthrough,
# 2026-11-03, three consecutive probes incl. a verbatim first-line quote).
#
# Per @deepseek-ai/dsh-agent-preset-registry 0.2.1-rc.5 README: overriding a
# shipped preset is a patch keyed by the preset row's id, and the override
# replaces the complete `config.plugins` child list (no deep merge) — so this
# row restates the whole shipped list verbatim. The ONLY change is that the
# shipped `persona` row (@deepseek-ai/dsh-persona, prefix "You are a coding
# agent powered by the {{model}} model.") is REMOVED: that plugin re-registers
# the DEPLOYMENT_PERSONA_PREFIX section name in the agent scope, and a scoped
# section shadows the global one by name (@deepseek-ai/dsh-persona 0.2.1-rc.5
# lib/index.js L7-8 "so this row is scope-only", L36-39 unconditional
# registration; dsh-system-prompt lib "A scoped section shadows a global
# section with the same name"). The S2-4 first fix attempt (prefix '') proved
# the point: the empty scoped section shadowed BOTH personas out of web
# sessions — the trace 初始系统提示词 carried neither. With the row removed the
# deployment personaPrefix above is the single persona source for web and
# headless alike (S2-4 walkthrough, 2026-11-03).
# Upgrade discipline (ADR-005): diff this list against presets/standard.patch.yml
# when bumping dsh — a user override does not auto-merge upstream changes.
# Known gap: the PTC preset (presets/ptc.patch.yml) still carries the coding
# persona; P0 walkthrough covers standard mode only (registered in
# progress-report S2 gap list).
- id: preset-standard
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: standard
    order: 1
    plugins:
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      # L2 code-execution tools default OFF (S3-3; ADR-009 / ADR-008): shell
      # execution is an approval-graded capability the product keeps disabled
      # until a dedicated enablement stage. First line of defense is the preset
      # row; second is the @hibuddy/coworker approval answerer, which denies
      # the same tool set with `l2DisabledReason` even if a tool row leaks
      # back (e.g. upstream preset changes or a future plugin route).
      #
      # Overridden official rows (dsh 0.2.1-rc.5, dsh-web-app
      # presets/standard.patch.yml): platform-conditional enables —
      #   tool-bash: `disabled: !!js process.platform === 'win32'`
      #   tool-pwsh: `disabled: !!js process.platform !== 'win32'`
      # (exactly one shell per platform). This override disables both on every
      # platform. Upgrade discipline (ADR-005): re-diff these rows when
      # bumping dsh.
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: true
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: true
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true
# ---------------------------------------------------------------------------
# Explicit default-model declaration (S5-4): restate the two routing rows
# instead of relying on the official defaults, so the product route cannot
# drift when the dsh-base bundle changes its defaults. `llm-pi-ai` with an
# empty `providers` map clears the built-in third-party catalog (minimax etc.;
# BYOK custom providers added in settings do not depend on it). Overridden
# official rows (dsh 0.2.1-rc.5, dsh-base cordis.patch.yml):
#   - id: llm-pi-ai — mounted with built-in providers predeclared.
#   - id: agent-default-model — mounted with NO config keys (official default
#     is {provider: deepseek-official, model: deepseek-flash}); the explicit
#     `reasoningEffort: high` restates the adapter default (dsh-llm-deepseek
#     config.d.ts: default `high`), so behavior is identical.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers: {}
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
