# HiBuddy smoke-profile patch layer (headless variant).
#
# Mirrors profile/hibuddy/cordis.patch.yml's smoke-test LLM override; keep the
# two files in sync while the smoke default model is MiniMax.
#
# dsh built-in `minimax-cn` provider route (checked against
# @deepseek-ai/dsh-llm-pi-ai@0.2.1-rc.5 / @earendil-works/pi-ai@1.4.0):
#   env key       : MINIMAX_CN_API_KEY   (global platform: MINIMAX_API_KEY, route id `minimax`)
#   endpoint      : https://api.minimaxi.com/anthropic (anthropic-messages)
#   catalog models: MiniMax-M2.7 | MiniMax-M2.7-highspeed | MiniMax-M3 | MiniMax-M3.1-Flash
# The key lives ONLY in the MINIMAX_CN_API_KEY environment variable (repo-root
# .env is a convenience store, but dsh does NOT auto-load it — export via setx
# or inject it into the process environment). Never commit it.
#
# Overridden official row (dsh 0.2.1-rc.5, dsh-base bundle):
#   - id: agent-default-model
#     config: {provider: deepseek-official, model: deepseek-flash}
- id: agent-default-model
  config:
    provider: minimax-cn
    model: MiniMax-M3.1-Flash
# Product persona (S2 task 2) — kept in sync with profile/hibuddy/cordis.patch.yml:
# the deployment-level default persona lives on the `system-prompt` row's
# config (personaPrefix). dsh-base declares `personaPrefix: ''` (dsh
# 0.2.1-rc.5 L504-507); there is no web-app layer in this headless bundle
# stack, so this profile patch is the only persona layer here. A patch
# replaces the whole `config` value (no deep merge), so the restatement below
# repeats every key the row declares: name + config.personaPrefix.
- id: system-prompt
  name: "@deepseek-ai/dsh-system-prompt"
  config:
    personaPrefix: >-
      You are HiBuddy, the user's everyday assistant, powered by the {{model}}
      model. Stay friendly and practical: understand the task, act with care,
      and answer in the user's language.
# Declares the route inside llm-pi-ai's `providers` dict so the pi-ai adapter
# registers for it; the installed catalog fills api/baseURL/models for a known
# route id, so apiKeyEnv alone is enough. Without this row the agent default
# model above fails with NO_ADAPTER (checked against dsh-llm-pi-ai 0.2.1-rc.5).
- id: llm-pi-ai
  config:
    providers:
      minimax-cn:
        apiKeyEnv: MINIMAX_CN_API_KEY
