# HiBuddy coworker bundle layer: mounts the host-side plugin.
# src/index.ts registers the approval layer (S3, ADR-009 §2):
# tools/pre-execute L2 default-off + stop-and-ask gate, approval/request
# answerer with session re-ask grants (免再询, grants API on ctx.webServer),
# turn/start streak reset. HiBuddy does not add tools — preset-standard's
# official tool set is reused as-is.
- insert:
    - id: hibuddy-coworker
      name: '@hibuddy/coworker'
